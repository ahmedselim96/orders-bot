name: missed-orders-cycle

# Runs about every 5 minutes (GitHub may delay scheduled runs). Mode is controlled by the
# repository VARIABLE BOT_MODE (changeable from the dashboard):
#   (not set / dry) -> read-only dry-run
#   live            -> really saves + converts (no cap per cycle; time budget below)
#   off             -> the job is skipped completely (kill switch)
# Settings (shipping table, platform fee, cap) live in config.json.
# NEVER add pull_request here (secrets must not reach forks).
on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs
  workflow_dispatch: {}

permissions:
  contents: write              # only to publish status.json to the "status" branch

concurrency:
  group: missed-orders-cycle    # no overlapping cycles
  cancel-in-progress: false

jobs:
  cycle:
    if: ${{ vars.BOT_MODE != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Run one cycle
        env:
          BOT_MODE: ${{ vars.BOT_MODE }}
          DRY_RUN: "1"
          LIVE_CONFIRM: "I-ACCEPT-LIVE-CONVERSIONS"
          ALLOW_BATCH: "yes-process-all"
          STAGE: "convert"
          STATE_DIR: ".state"
          MAX_ACTIONS: "0"
          BUDGET_SECONDS: "780"
          EASYORDERS_STATE: ${{ secrets.EASYORDERS_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_cycle.py
      - name: Save state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish status for the dashboard
        if: always()
        continue-on-error: true
        run: |
          if [ -f .state/status.json ]; then
            rm -rf /tmp/pub && mkdir /tmp/pub && cp .state/status.json /tmp/pub/status.json
            cd /tmp/pub
            git init -q -b status
            git add status.json
            git -c user.name="orders-bot" -c user.email="orders-bot@users.noreply.github.com" commit -q -m "status"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
          fi
